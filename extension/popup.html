<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Cookie Agent</title>
  <style>
    body { font-family: system-ui, -apple-system, "PingFang SC", sans-serif; width: 380px; padding: 14px; color: #222; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    p { margin: 6px 0; font-size: 12px; color: #555; }
    code { background: #f0f0f0; padding: 2px 5px; border-radius: 4px; font-size: 12px; word-break: break-all; }
    input, textarea, button { width: 100%; box-sizing: border-box; margin: 6px 0; font-size: 13px; }
    input, textarea { padding: 6px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 8px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button.secondary { background: #e5e7eb; color: #222; }
    textarea { height: 180px; resize: vertical; }
    .ok { color: #16a34a; }
  </style>
</head>
<body>
  <h3>Cookie Agent Bridge</h3>
  <p>扩展 ID: <code id="extid">-</code></p>
  <p>状态: <span id="status" class="ok">已加载</span></p>
  <p>Agent 调用端点: <code>http://127.0.0.1:9898/cookies?url=&lt;url&gt;</code></p>
  <input id="url" placeholder="https://example.com" />
  <button id="fetch">获取 Cookie</button>
  <button id="copy" class="secondary">复制结果</button>
  <textarea id="out" readonly placeholder="结果将显示在这里"></textarea>
  <script src="popup.js"></script>
</body>
</html>
